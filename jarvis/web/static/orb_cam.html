<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Jarvis Orb — Camera</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
  }
  /* Fundo escuro com leve brilho central, igual ao HUD */
  body {
    background: radial-gradient(circle at 50% 42%, #0a1622 0%, #04070d 70%);
    display: flex; align-items: center; justify-content: center;
  }
  /* O canvas do orb e 380x440; escalamos pra preencher um quadro 16:9. */
  #wrap { transform: scale(1.6); transform-origin: center; }
  #orb { filter: drop-shadow(0 0 40px rgba(0,191,255,.35)); }
</style>
</head>
<body>
  <div id="wrap"><canvas id="orb" width="380" height="440"></canvas></div>
  <script src="/static/orb.js"></script>
  <script>
    // Orb "vivo" pra servir de camera no Meet, sem depender de audio real:
    // geramos um espectro sintetico suave (varias senoides) e mantemos o estado
    // "speaking" pra esfera pulsar e as barras se moverem continuamente.
    (function () {
      const N = 64;
      const buf = new Uint8Array(N);
      let t = 0;
      function synth() {
        t += 0.05;
        for (let i = 0; i < N; i++) {
          const base = 0.35 + 0.30 * Math.sin(t * 1.3 + i * 0.35)
                              + 0.18 * Math.sin(t * 2.7 + i * 0.11);
          const v = Math.max(0, Math.min(1, (base + 1) / 2 * 0.7));
          buf[i] = Math.floor(v * 255);
        }
        return buf;
      }
      const orb = new Orb(document.getElementById('orb'), synth);
      // Alterna sutilmente entre "listening" e "speaking" pra parecer vivo.
      orb.setState('speaking');
      let toggle = false;
      setInterval(() => {
        toggle = !toggle;
        orb.setState(toggle ? 'speaking' : 'listening');
      }, 4000);
    })();
  </script>
</body>
</html>
